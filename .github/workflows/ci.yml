name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      ENVMGR_HOME: /tmp/.envmgr

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Bootstrap envmgr runtime
        run: uv run envmgr setup

      - name: Verify first-run command surface
        run: |
          uv run envmgr ping
          uv run envmgr install -l

      - name: Run validation suite
        run: uv run validate

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    env:
      ENVMGR_HOME: /tmp/.envmgr

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Bootstrap envmgr runtime
        run: uv run envmgr setup

      - name: Run smoke tests with multi-node topology checks
        run: uv run smoke-test

  package_surface:
    name: Package Surface
    runs-on: ubuntu-latest
    env:
      UV_NO_PROGRESS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Build no-sources release artifacts
        run: uv build --no-sources --out-dir dist

      - name: Inspect artifacts and package surface
        run: |
          python - <<'PY'
          from configparser import ConfigParser
          from pathlib import Path
          from zipfile import ZipFile

          dist = Path("dist")
          wheels = sorted(dist.glob("envmgr-*.whl"))
          sdists = sorted(dist.glob("envmgr-*.tar.gz"))
          unexpected = sorted(dist.glob("*envmgr-dev-helpers*"))

          if unexpected:
              raise SystemExit(f"unexpected envmgr-dev-helpers artifact: {unexpected}")
          if len(wheels) != 1:
              raise SystemExit(f"expected one envmgr wheel, found: {wheels}")
          if len(sdists) != 1:
              raise SystemExit(f"expected one envmgr sdist, found: {sdists}")

          with ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              entry_point_files = [
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              ]
              if len(entry_point_files) != 1:
                  raise SystemExit(
                      f"expected one entry_points.txt, found: {entry_point_files}"
                  )

              parser = ConfigParser()
              parser.read_string(wheel.read(entry_point_files[0]).decode())
              console_scripts = dict(parser.items("console_scripts"))
              expected_scripts = {"envmgr": "envmgr.main:main"}
              if console_scripts != expected_scripts:
                  raise SystemExit(
                      "expected installed artifacts to expose only envmgr; "
                      f"found: {console_scripts}"
                  )

              required_assets = (
                  "envmgr/_assets/ansible.cfg",
                  "envmgr/_assets/requirements.yaml",
                  "envmgr/_assets/playbooks/",
                  "envmgr/_assets/roles/",
                  "envmgr/_assets/vars/",
              )
              for asset in required_assets:
                  if not any(name == asset or name.startswith(asset) for name in names):
                      raise SystemExit(f"missing bundled runtime asset: {asset}")
          PY

      - name: Smoke-test isolated wheel install
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path("dist").glob("envmgr-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one envmgr wheel, found: {wheels}")
          print(wheels[0])
          PY
          )"
          python_path="$(python -c 'import sys; print(sys.executable)')"
          tmpdir="$(mktemp -d)"
          export UV_TOOL_DIR="$tmpdir/tools"
          export UV_TOOL_BIN_DIR="$tmpdir/bin"
          uv tool install --python "$python_path" --force "$wheel"
          "$UV_TOOL_BIN_DIR/envmgr" --version

          for helper in create lint ansible-check typecheck validate smoke-test; do
            if [[ -e "$UV_TOOL_BIN_DIR/$helper" || -e "$UV_TOOL_BIN_DIR/$helper.exe" ]]; then
              echo "unexpected checkout-only helper shim installed: $helper" >&2
              exit 1
            fi
          done

  init_install:
    name: Init Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    env:
      ENVMGR_HOME: /tmp/.envmgr

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Bootstrap envmgr runtime
        run: uv run envmgr setup

      - name: Run init install on localhost
        run: uv run envmgr install init --playbook playbooks/workstation.yml

  master_worker_e2e:
    name: Master/Worker E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Sanity-check E2E Docker Compose
        run: bash .github/scripts/check-e2e-compose.sh

      - name: Run master-to-workers multi-node e2e
        run: .github/scripts/run-master-worker-e2e.sh

  release_readiness:
    name: Release Readiness
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Check merge would produce a release tag
        run: .github/scripts/check-release-readiness.sh
