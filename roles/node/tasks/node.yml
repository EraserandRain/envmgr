---
- name: Download volta installer if not exists
  get_url:
    url: https://get.volta.sh
    dest: "{{ installers_cache_dir }}/volta-installer"
    mode: "0755"
    force: false
    timeout: 30
  register: volta_installer_download
  retries: 3
  delay: 5
  until: volta_installer_download is succeeded

- name: Install volta by volta installer
  script: "{{ installers_cache_dir }}/volta-installer"
  args:
    executable: /bin/bash
    creates: "{{ volta_root }}"

- name: Create envmgr profile.d directory
  file:
    path: "{{ envmgr_profile_dir }}"
    state: directory
    mode: "0755"

- name: Remove legacy numbered Volta profile drop-in
  file:
    path: "{{ envmgr_profile_dir }}/30-node-volta.sh"
    state: absent

- name: Write Volta profile drop-in
  copy:
    dest: "{{ envmgr_profile_dir }}/node-volta.sh"
    mode: "0644"
    content: |
      export VOLTA_HOME="${VOLTA_HOME:-$HOME/.volta}"
      case ":$PATH:" in
        *":$VOLTA_HOME/bin:"*) ;;
        *) export PATH="$VOLTA_HOME/bin:$PATH" ;;
      esac
      export VOLTA_FEATURE_PNPM=1

- name: Resolve Node.js binary through Volta before install
  command: volta which node
  register: node_binary_before
  changed_when: false
  failed_when: false

- name: Install node (Latest LTS Version)
  command: volta install node@lts
  changed_when: false

- name: Resolve Node.js binary through Volta after install
  command: volta which node
  register: node_binary_after
  changed_when: >-
    node_binary_after.stdout | default('', true) | trim !=
    node_binary_before.stdout | default('', true) | trim
  failed_when: false

- name: Resolve pnpm binary through Volta before install
  command: volta which pnpm
  register: pnpm_binary_before
  changed_when: false
  failed_when: false

- name: Install pnpm (Latest Version)
  command: volta install pnpm@latest
  changed_when: false

- name: Resolve pnpm binary through Volta after install
  command: volta which pnpm
  register: pnpm_binary_after
  changed_when: >-
    pnpm_binary_after.stdout | default('', true) | trim !=
    pnpm_binary_before.stdout | default('', true) | trim
  failed_when: false
