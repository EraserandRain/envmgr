---
- name: Verify volta is available
  when: ai_tools_volta_version is not defined
  block:
    - name: Check volta version for Codex tasks
      command: volta --version
      register: volta_version
      changed_when: false
      failed_when: volta_version.rc != 0

    - name: Cache volta version fact for Codex tasks
      set_fact:
        ai_tools_volta_version: "{{ volta_version.stdout }}"

- name: Check Codex CLI version
  include_tasks: check_tool_version.yml
  vars:
    tool_name: "Codex CLI"
    binary_name: "codex"
    package_name: "@openai/codex"
  when: not (codex_needs_update is defined and codex_current_version is defined and codex_latest_version is defined)

- name: Ensure Codex CLI binary is installed
  include_tasks:
    file: install_ai_tool.yml
  vars:
    ai_tool_name: "Codex CLI"
    ai_tool_install_command: "volta install @openai/codex@latest"
    ai_tool_needs_update_var: "codex_needs_update"
    ai_tool_binary_path: "{{ volta_root }}/bin/{{ ai_tools_config.codex.binary }}"

- name: Verify Codex CLI installation and get version
  command: codex --version
  register: codex_version_check
  changed_when: false
  failed_when: false

- name: Set Codex CLI installation status
  set_fact:
    codex_installed: "{{ codex_version_check.rc == 0 }}"
    codex_version: "{{ codex_version_check.stdout if codex_version_check.rc == 0 else 'version check failed' }}"

- name: Display Codex CLI summary and usage guidance
  include_tasks:
    file: show_tool_summary.yml
  vars:
    ai_tool_display_name: "Codex CLI"
    ai_tool_installed: "{{ codex_installed | default(false) }}"
    ai_tool_version: "{{ codex_version }}"
    ai_tool_summary_footer: "======================================"
    usage_lines:
      - "Codex CLI Installation Complete!"
      - ""
      - "Next steps:"
      - "1. Run 'codex' to start the CLI"
      - "2. API key configuration may be required"
      - ""
      - "Codex CLI is now available in your PATH via volta."
