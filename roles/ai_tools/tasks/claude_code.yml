---
- name: Verify volta is available
  when: ai_tools_volta_version is not defined
  block:
    - name: Check volta version for Claude Code tasks
      command: volta --version
      register: volta_version
      changed_when: false
      failed_when: volta_version.rc != 0

    - name: Cache volta version fact for Claude Code tasks
      set_fact:
        ai_tools_volta_version: "{{ volta_version.stdout }}"

- name: Display volta version
  debug:
    msg: "Using volta {{ ai_tools_volta_version }}"

- name: Check Claude Code version
  include_tasks: check_tool_version.yml
  vars:
    tool_name: "Claude Code"
    binary_name: "claude"
    package_name: "@anthropic-ai/claude-code"
  when: not (claude_needs_update is defined and claude_current_version is defined and claude_latest_version is defined)

- name: Ensure Claude Code binary is installed
  include_tasks:
    file: install_ai_tool.yml
  vars:
    ai_tool_name: "Claude Code"
    ai_tool_install_command: "volta install @anthropic-ai/claude-code@latest"
    ai_tool_needs_update_var: "claude_needs_update"
    ai_tool_binary_path: "{{ volta_root }}/bin/{{ ai_tools_config.claude_code.binary }}"

- name: Verify Claude Code installation and get version
  command: claude --version
  register: claude_version_check
  changed_when: false
  failed_when: false

- name: Set Claude Code installation status
  set_fact:
    claude_installed: "{{ claude_version_check.rc == 0 }}"
    claude_version: "{{ claude_version_check.stdout if claude_version_check.rc == 0 else 'version check failed' }}"

- name: Display Claude Code summary and usage guidance
  include_tasks:
    file: show_tool_summary.yml
  vars:
    ai_tool_display_name: "Claude Code"
    ai_tool_installed: "{{ claude_installed | default(false) }}"
    ai_tool_version: "{{ claude_version }}"
    ai_tool_summary_footer: "========================================"
    usage_lines:
      - "Claude Code Installation Complete!"
      - ""
      - "Next steps:"
      - "1. Run 'claude' to start the CLI"
      - "2. Authentication may be required on first use"
      - ""
      - "Claude Code is now available in your PATH via volta."
